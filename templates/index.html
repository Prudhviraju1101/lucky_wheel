<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Wheel</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #12121c;
            color: #d9dcf5;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 { color: #ffd166; margin-bottom: 8px; }
        p { color: #aeb3d5; }
        .wheel-wrap {
            position: relative;
            width: min(82vw, 420px);
            aspect-ratio: 1;
            margin: 20px 0;
        }
        canvas { width: 100%; height: 100%; }
        .pointer {
            position: absolute;
            z-index: 2;
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 17px solid transparent;
            border-right: 17px solid transparent;
            border-top: 32px solid #ffd166;
            filter: drop-shadow(0 2px 3px #000);
        }
        button {
            border: 0;
            border-radius: 12px;
            padding: 14px 42px;
            background: #ff6b6b;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #ff8787; }
        button:disabled { opacity: .55; cursor: wait; }
        #result { min-height: 30px; color: #ffd166; font-size: 22px; font-weight: bold; }
        #history { color: #aeb3d5; text-align: center; }
    </style>
</head>
<body>
    <h1>🎡 Lucky Wheel</h1>
    <p>Spin the wheel and find your lucky number!</p>

    <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="600" height="600"></canvas>
    </div>

    <button id="spinButton" onclick="spinWheel()">SPIN</button>
    <div id="result">Ready to spin?</div>
    <div id="history">Last results: —</div>

    <script>
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const total = 32;
        const arc = (Math.PI * 2) / total;
        let rotation = 0;
        let spinning = false;
        let history = [];

        function drawWheel() {
            const center = canvas.width / 2;
            const radius = 280;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < total; i++) {
                const start = rotation + i * arc - Math.PI / 2;
                const end = start + arc;

                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, start, end);
                ctx.closePath();
                ctx.fillStyle = i % 2 === 0 ? "#262a45" : "#1b1e33";
                ctx.fill();
                ctx.strokeStyle = "#3b4070";
                ctx.lineWidth = 2;
                ctx.stroke();

                const angle = start + arc / 2;
                const textRadius = 230;
                ctx.save();
                ctx.translate(
                    center + Math.cos(angle) * textRadius,
                    center + Math.sin(angle) * textRadius
                );
                ctx.rotate(angle + Math.PI / 2);
                ctx.fillStyle = "#ffd166";
                ctx.font = "bold 21px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(i + 1, 0, 0);
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(center, center, 90, 0, Math.PI * 2);
            ctx.fillStyle = "#171827";
            ctx.fill();
            ctx.strokeStyle = "#ffd166";
            ctx.lineWidth = 5;
            ctx.stroke();

            ctx.fillStyle = "#ffd166";
            ctx.font = "bold 25px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("LUCKY", center, center - 15);
            ctx.fillText("WHEEL", center, center + 18);
        }

        function spinWheel() {
            if (spinning) return;

            spinning = true;
            const button = document.getElementById("spinButton");
            const result = document.getElementById("result");
            button.disabled = true;
            result.textContent = "Spinning...";

            fetch("/spin")
                .then(response => {
                    if (!response.ok) throw new Error("Spin request failed");
                    return response.json();
                })
                .then(data => {
                    const winner = data.winner;
                    const segmentCenter = (winner - 1) * arc + arc / 2;
                    const desiredRotation = -segmentCenter;
                    const current = ((rotation % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
                    const target = ((desiredRotation % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
                    const extra = 2 * Math.PI * 6;
                    const delta = extra + ((target - current + 2 * Math.PI) % (2 * Math.PI));
                    const startRotation = rotation;
                    const endRotation = rotation + delta;
                    const startTime = performance.now();
                    const duration = 4000;

                    function animate(now) {
                        const progress = Math.min((now - startTime) / duration, 1);
                        const eased = 1 - Math.pow(1 - progress, 4);
                        rotation = startRotation + delta * eased;
                        drawWheel();

                        if (progress < 1) {
                            requestAnimationFrame(animate);
                        } else {
                            rotation = endRotation;
                            drawWheel();
                            result.textContent = "🎉 Winner: " + winner;
                            history.unshift(winner);
                            history = history.slice(0, 6);
                            document.getElementById("history").textContent =
                                "Last results: " + history.join(" • ");
                            button.disabled = false;
                            spinning = false;
                        }
                    }

                    requestAnimationFrame(animate);
                })
                .catch(() => {
                    result.textContent = "Could not spin. Please try again.";
                    button.disabled = false;
                    spinning = false;
                });
        }

        drawWheel();
    </script>
</body>
</html>
